[project]
name = "fullscale-room-builder"
version = "0.1.0"
description = "Turns a Fullscale phone capture into a detailed, coloured 3D model of the space"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26",
  "open3d>=0.18",
  "pillow>=10",
]

[project.scripts]
room-builder = "room_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/room_builder"]
